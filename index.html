<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵 · 空间 · 变换 —— 三合一学习中心</title>
<script>
(function() {
  try {
    var s = localStorage.getItem('mf-theme');
    if (!s) s = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (s === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>
<style>
:root {
  color-scheme: dark;
  --bg-primary: #0a0a0f;
  --bg-secondary: #11111a;
  --bg-card: #14141f;
  --text-primary: #e8e8f0;
  --text-secondary: #9090a8;
  --text-tertiary: #686880;
  --accent-blue: #39d2c0;
  --accent-orange: #ffb454;
  --accent-purple: #7aa2f7;
  --border-primary: rgba(255,255,255,0.08);
  --border-secondary: rgba(255,255,255,0.05);
  --radius-sm: 8px;
  --radius-md: 14px;
  --shadow-card: 0 8px 32px -8px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  --glow-cyan: rgba(57,210,192,0.15);
  --glow-blue: rgba(122,162,247,0.10);
  --transition-fast: 0.2s cubic-bezier(0.32, 0.72, 0, 1);
}
[data-theme="light"] {
  color-scheme: light;
  --bg-primary: #ffffff;
  --bg-secondary: #f6f8fa;
  --bg-card: #ffffff;
  --text-primary: #24292e;
  --text-secondary: #586069;
  --text-tertiary: #6a737d;
  --accent-blue: #0366d6;
  --accent-orange: #bc5e0a;
  --accent-purple: #5762a4;
  --border-primary: #d0d7de;
  --border-secondary: #e1e4e8;
  --shadow-card: 0 2px 8px rgba(0,0,0,0.08);
  --glow-cyan: rgba(3,102,214,0.05);
  --glow-blue: rgba(87,98,164,0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', -apple-system, system-ui, sans-serif;
  background-color: var(--bg-primary);
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 0%, var(--glow-cyan), transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 25%, var(--glow-blue), transparent 55%);
  background-attachment: fixed;
  color: var(--text-primary);
  display: flex; flex-direction: column; overflow: hidden;
}
header {
  flex-shrink: 0; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 12px 22px 10px;
  border-bottom: 1px solid var(--border-secondary);
}
h1 { font-size: 19px; font-weight: 800; white-space: nowrap; }
h1 .hl { color: var(--accent-blue); text-shadow: 0 0 18px rgba(57,210,192,0.35); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 320px; }
.tab {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  color: var(--text-secondary); font-size: 13.5px; font-weight: 550;
  padding: 8px 18px; border-radius: 999px; cursor: pointer;
  transition: all var(--transition-fast); font-family: inherit; white-space: nowrap;
}
.tab .ic { font-size: 15px; }
.tab small { font-size: 10.5px; color: var(--text-tertiary); font-weight: 400; }
.tab:hover { border-color: var(--accent-blue); color: var(--text-primary); }
.tab.active {
  background: var(--accent-blue); color: #fff; border-color: var(--accent-blue);
  box-shadow: 0 4px 18px -4px color-mix(in srgb, var(--accent-blue) 55%, transparent);
}
.tab.active small { color: rgba(255,255,255,0.75); }
.theme-toggle {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border-primary);
  color: var(--text-secondary); font-size: 16px; cursor: pointer;
  box-shadow: var(--shadow-card); transition: all var(--transition-fast);
  display: flex; align-items: center; justify-content: center;
}
.theme-toggle:hover { color: var(--accent-blue); border-color: var(--accent-blue); }
.stage { flex: 1; min-height: 0; position: relative; }
.stage iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none;
  background: var(--bg-primary); display: none;
}
.stage iframe.show { display: block; }
.loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 14px; pointer-events: none;
  background: var(--bg-primary); transition: opacity .4s; z-index: 5;
}
.loading.hide { opacity: 0; }
footer {
  flex-shrink: 0; text-align: center; font-size: 11.5px; color: var(--text-tertiary);
  padding: 6px 16px; border-top: 1px solid var(--border-secondary);
}
footer a { color: var(--text-tertiary); text-decoration: none; }
footer a:hover { color: var(--accent-blue); }
@media (max-width: 760px) {
  h1 { font-size: 16px; }
  .tab { padding: 7px 12px; font-size: 12.5px; }
  .tab small { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>矩阵 · 空间 · 变换 <span class="hl">三合一学习中心</span></h1>
  <nav class="tabs" id="tabs">
    <button class="tab" data-key="box"><span class="ic">🎓</span>盒子矩阵课<small>8 步流程教学 + 测验</small></button>
    <button class="tab" data-key="tutorial"><span class="ic">📖</span>矩阵与空间变换<small>完整教程 · 6 演示</small></button>
    <button class="tab" data-key="lab"><span class="ic">🔬</span>点 × 矩阵实验室<small>自由实验台</small></button>
    <button class="tab" data-key="qcourse"><span class="ic">🎓</span>四元数课程<small>9 步教学 + 测验</small></button>
    <button class="tab" data-key="qlab"><span class="ic">🔬</span>四元数实验室<small>互转/FTransform/slerp</small></button>
  </nav>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题" title="切换暗/亮主题（同步到三个页面）">&#9790;</button>
</header>

<div class="stage">
  <div class="loading" id="loading">页面加载中…</div>
  <iframe id="f-box" title="盒子的矩阵课"></iframe>
  <iframe id="f-tutorial" title="矩阵与空间变换教程"></iframe>
  <iframe id="f-lab" title="点的矩阵变换 3D 实验室"></iframe>
  <iframe id="f-qcourse" title="四元数课程"></iframe>
  <iframe id="f-qlab" title="四元数实验室"></iframe>
</div>

<footer>
  三个页面也可独立访问：
  <a href="https://18163623522.github.io/transform-box-lab/" target="_blank">盒子矩阵课</a> ·
  <a href="https://18163623522.github.io/matrix-space-tutorial/" target="_blank">矩阵与空间变换</a> ·
  <a href="https://18163623522.github.io/point-matrix-lab/" target="_blank">点×矩阵实验室</a> ·
  <a href="https://18163623522.github.io/quaternion-course/" target="_blank">四元数课程</a> ·
  <a href="https://18163623522.github.io/quaternion-lab/" target="_blank">四元数实验室</a>
  　|　建议顺序：盒子课直觉 → 教程系统展开 → 矩阵实验室 → 四元数课程 → 四元数实验室
</footer>

<script>
var URLS = {
  box: 'https://18163623522.github.io/transform-box-lab/',
  tutorial: 'https://18163623522.github.io/matrix-space-tutorial/',
  lab: 'https://18163623522.github.io/point-matrix-lab/',
  qcourse: 'https://18163623522.github.io/quaternion-course/',
  qlab: 'https://18163623522.github.io/quaternion-lab/'
};
var loaded = {};
var cur = 'box';
try { cur = localStorage.getItem('mf-tab') || 'box'; if (!URLS[cur]) cur = 'box'; } catch (e) {}

function curTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function broadcastTheme() {
  ['box', 'tutorial', 'lab', 'qcourse', 'qlab'].forEach(function(k) {
    var f = document.getElementById('f-' + k);
    try { if (f.contentWindow) f.contentWindow.postMessage({ type: 'mf-theme', theme: curTheme() }, '*'); } catch (e) {}
  });
}
function toggleTheme() {
  var el = document.documentElement;
  var light = el.getAttribute('data-theme') === 'light';
  if (light) { el.removeAttribute('data-theme'); localStorage.setItem('mf-theme', 'dark'); }
  else { el.setAttribute('data-theme', 'light'); localStorage.setItem('mf-theme', 'light'); }
  broadcastTheme();
}
function activate(key) {
  cur = key;
  try { localStorage.setItem('mf-tab', key); } catch (e) {}
  document.querySelectorAll('.tab').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-key') === key);
  });
  ['box', 'tutorial', 'lab', 'qcourse', 'qlab'].forEach(function(k) {
    var f = document.getElementById('f-' + k);
    f.classList.toggle('show', k === key);
    if (k === key && !loaded[k]) {
      loaded[k] = true;
      f.addEventListener('load', function() {
        setTimeout(broadcastTheme, 150);
        document.getElementById('loading').classList.add('hide');
      });
      f.src = URLS[k];
    }
  });
  if (loaded[key]) document.getElementById('loading').classList.add('hide');
}
document.querySelectorAll('.tab').forEach(function(b) {
  b.addEventListener('click', function() { activate(b.getAttribute('data-key')); });
});
// 键盘 1/2/3 快捷切换
window.addEventListener('keydown', function(e) {
  if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  var map = { '1': 'box', '2': 'tutorial', '3': 'lab', '4': 'qcourse', '5': 'qlab' };
  if (map[e.key]) activate(map[e.key]);
});
activate(cur);
</script>
</body>
</html>
